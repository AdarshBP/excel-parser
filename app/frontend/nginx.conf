server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Allow file uploads up to 50 MB (20 files × ~2 MB each, plus overhead)
    client_max_body_size 50m;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Proxy /api to the backend service
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Cookie            $http_cookie;
        proxy_read_timeout 120s;

        # Pass Set-Cookie back (session cookie from FastAPI)
        proxy_pass_header  Set-Cookie;
    }

    # Public pages (no login required — needed for Google OAuth verification)
    location = /home {
        try_files /home.html =404;
    }
    location = /privacy {
        try_files /privacy.html =404;
    }
    location = /terms {
        try_files /terms.html =404;
    }

    # Angular SPA — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
