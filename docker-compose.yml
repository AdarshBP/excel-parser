# Excel Parser — production deployment (pull from Docker Hub).
#
#   docker compose up -d                  # start everything
#   docker compose pull                   # pull latest images
#   docker compose logs -f                # follow all logs
#
# Prerequisites:
#   1. Create a .env file with your PostgreSQL credentials and app settings
#   2. Create a workbooks/ folder (or set WORKBOOK_DIR) with your source files
#
# On first run, create the default user:
#   docker compose exec backend python3 users.py add admin

services:

  # ── FastAPI backend (API only) ──
  backend:
    image: ${DOCKER_REGISTRY:-adarshbp}/excel-parser-backend:${TAG:-latest}
    container_name: excel-parser-backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_SCHEMA: ${APP_SCHEMA:-excelparser_config}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:4200}
      PYTHONUNBUFFERED: 1
      WORKBOOK_DIR: /excel_parser/workbooks
    volumes:
      - ${WORKBOOK_DIR:-./workbooks}:/excel_parser/workbooks:ro
      - backend-cache:/excel_parser/app/cache
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Angular frontend (nginx: serves SPA + proxies /api → backend) ──
  frontend:
    image: ${DOCKER_REGISTRY:-adarshbp}/excel-parser-frontend:${TAG:-latest}
    container_name: excel-parser-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-cache:
